<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d0d1a"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d7cff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00e0ff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d7cff" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#4d7cff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4d7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="600" cy="320" rx="520" ry="260" fill="url(#glow)"/>

  <rect x="90" y="80" width="72" height="72" rx="16" fill="#0d0d1a" stroke="#1e2040" stroke-width="2"/>
  <text x="126" y="134" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="900" text-anchor="middle" fill="#5bc8f5">C</text>

  <text x="180" y="132" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Classroom<tspan font-weight="400" fill="#8899bb">Connect</tspan></text>

  <line x1="90" y1="185" x2="1110" y2="185" stroke="#1e2040" stroke-width="1.5"/>

  <text x="600" y="312" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2" text-anchor="middle" fill="url(#accentGrad)">Free Browser Games</text>
  <text x="600" y="382" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#ffffff">Nothing to install</text>

  <text x="600" y="452" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#8899bb">440 games · No download · No account · Runs in any browser</text>

  <line x1="90" y1="510" x2="1110" y2="510" stroke="#1e2040" stroke-width="1.5"/>
  <text x="600" y="558" font-family="Figtree, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#4d6aaa">classroom-connect.co.uk</text>
</svg>
