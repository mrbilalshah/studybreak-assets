<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d1a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a2e" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d7cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow blob -->
  <ellipse cx="600" cy="315" rx="400" ry="200" fill="#4d7cff" opacity="0.06"/>

  <!-- Logo C -->
  <rect x="90" y="80" width="72" height="72" rx="16" fill="#0d0d1a" stroke="#1e2040" stroke-width="2"/>
  <text x="126" y="137" font-family="Arial Black, Arial, sans-serif" font-size="54" font-weight="900" text-anchor="middle" fill="#5bc8f5">C</text>

  <!-- Brand name -->
  <text x="176" y="133" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Classroom Connect</text>

  <!-- Divider line -->
  <line x1="90" y1="185" x2="1110" y2="185" stroke="#1e2040" stroke-width="1.5"/>

  <!-- Main headline -->
  <text x="600" y="310" font-family="Arial Black, Arial, sans-serif" font-size="64" font-weight="900" text-anchor="middle" fill="url(#accentGrad)">Free Unblocked Games</text>
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#ffffff">for Students</text>

  <!-- Subtext -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#8899bb">200+ browser games · No downloads · No logins · Works on Chromebooks</text>

  <!-- Divider line bottom -->
  <line x1="90" y1="510" x2="1110" y2="510" stroke="#1e2040" stroke-width="1.5"/>

  <!-- Footer URL -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4d6aaa">classroom-connect.co.uk</text>
</svg>
