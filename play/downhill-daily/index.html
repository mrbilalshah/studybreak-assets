<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Downhill Daily</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ink: #17253b;
    --ink-soft: #4a5a72;
    --snow: #f3f7fb;
    --coral: #ff5a4e;
    --coral-dark: #e2453a;
    --ice: #3fa9d6;
    --card: rgba(255, 255, 255, 0.94);
    --pill: rgba(23, 37, 59, 0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--snow); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }

  .hud {
    position: fixed; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding: 10px 12px; pointer-events: none; gap: 8px;
  }
  .hud[hidden] { display: none; }
  .pill {
    background: var(--pill); color: #fff; border-radius: 12px; padding: 6px 11px;
    font-variant-numeric: tabular-nums; line-height: 1.15; backdrop-filter: blur(4px);
  }
  .pill small { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .pill strong { font-size: 20px; font-weight: 800; }
  .hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .pill-sm strong { font-size: 15px; }
  .combo strong { font-size: 15px; }
  .combo { background: var(--coral); }
  .combo[hidden] { display: none; }
  .hud-right { display: flex; gap: 8px; align-items: flex-start; }
  .icon-btn {
    pointer-events: auto; width: 38px; height: 38px; border-radius: 12px; border: 0;
    background: var(--pill); color: #fff; display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn:focus-visible, .btn:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

  .screen {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: linear-gradient(180deg, rgba(243, 247, 251, 0.15), rgba(23, 37, 59, 0.28));
  }
  .screen[hidden] { display: none; }
  .card {
    width: min(380px, 100%); background: var(--card); border-radius: 20px; padding: 22px 22px 18px;
    box-shadow: 0 18px 50px rgba(23, 37, 59, 0.25); text-align: center;
  }
  .wordmark {
    margin: 0 0 4px; font-size: 40px; line-height: 0.9; font-weight: 900; font-style: italic;
    letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink);
  }
  .wordmark span { color: var(--coral); display: block; }
  .sub { margin: 6px 0 14px; color: var(--ink-soft); font-size: 14px; }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 14px; padding: 13px 14px; margin-top: 10px;
    font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
  }
  .btn.primary { background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-dark); }
  .btn.primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--coral-dark); }
  .btn.secondary { background: #e6edf5; color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink-soft); font-weight: 700; padding: 8px; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .hint { margin: 14px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .hint kbd {
    font: inherit; font-weight: 800; background: #e6edf5; border-radius: 6px; padding: 1px 6px; color: var(--ink);
  }
  .best-line { font-size: 13px; color: var(--ink-soft); margin-top: 8px; font-variant-numeric: tabular-nums; }

  .result-title { margin: 0; font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--coral); }
  .result-reason { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
  .result-score { margin: 8px 0 0; font-size: 54px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .newbest {
    display: inline-block; margin-top: 8px; background: #fff1c2; color: #8a5a00; border-radius: 999px;
    padding: 3px 10px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em;
  }
  .newbest[hidden] { display: none; }
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .stat { background: #eef3f8; border-radius: 10px; padding: 7px 4px; }
  .stat b { display: block; font-size: 16px; }
  .stat span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .toast {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; pointer-events: none;
    opacity: 0; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Downhill Daily game"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-left">
    <div class="pill"><small>Score</small><strong id="hudScore">0</strong></div>
    <div class="pill pill-sm"><small id="hudModeLabel">Mountain</small><strong id="hudDist">0 m</strong></div>
    <div class="pill combo" id="hudCombo" hidden><strong id="hudComboVal">x2</strong></div>
  </div>
  <div class="hud-right">
    <div class="pill"><small>km/h</small><strong id="hudSpeed">0</strong></div>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
    </button>
  </div>
</div>

<section class="screen" id="menu" aria-labelledby="menuTitle">
  <div class="card">
    <h1 class="wordmark" id="menuTitle">Downhill<span>Daily</span></h1>
    <p class="sub" id="menuSub">Mountain #1</p>
    <button class="btn primary" id="playDaily">Ride today's mountain</button>
    <button class="btn secondary" id="playFree">Free ride</button>
    <p class="best-line" id="menuBest"></p>
    <p class="hint">
      <kbd>Space</kbd> or tap to switch your carve. <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to steer.<br>
      Fly off a ramp and tap to spin, but land straight.<br>
      Pass between the flags to build your combo.
    </p>
    <div class="row">
      <button class="btn ghost" id="muteBtnMenu" aria-pressed="false">Sound: on</button>
    </div>
  </div>
</section>

<section class="screen" id="pause" hidden aria-labelledby="pauseTitle">
  <div class="card">
    <h2 class="wordmark" id="pauseTitle" style="font-size:32px">Paused</h2>
    <button class="btn primary" id="resumeBtn">Resume</button>
    <div class="row">
      <button class="btn secondary" id="restartBtn">Restart</button>
      <button class="btn secondary" id="quitBtn">Menu</button>
    </div>
    <button class="btn ghost" id="muteBtnPause" aria-pressed="false">Sound: on</button>
  </div>
</section>

<section class="screen" id="results" hidden aria-labelledby="resultTitle">
  <div class="card">
    <p class="result-title" id="resultTitle">Wiped out</p>
    <p class="result-reason" id="resultReason">You hit a tree.</p>
    <p class="result-score" id="resultScore">0</p>
    <span class="newbest" id="resultNewBest" hidden>New best</span>
    <p class="best-line" id="resultBest"></p>
    <div class="stats">
      <div class="stat"><b id="statDist">0</b><span>metres</span></div>
      <div class="stat"><b id="statGates">0</b><span>gates</span></div>
      <div class="stat"><b id="statTricks">0</b><span>spins</span></div>
      <div class="stat"><b id="statTop">0</b><span>top km/h</span></div>
    </div>
    <button class="btn primary" id="againBtn">Ride again</button>
    <div class="row">
      <button class="btn secondary" id="shareBtn">Copy result</button>
      <button class="btn secondary" id="menuBtn">Menu</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<p class="sr-only" aria-live="polite" id="srStatus"></p>

<script src="game.js"></script>
</body>
</html>
